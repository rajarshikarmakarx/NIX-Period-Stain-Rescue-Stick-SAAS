services:
    - type: web
      name: nix-backend
      runtime: python
      rootDir: backend
      buildCommand: pip install -r requirements.txt
      startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
      envVars:
        - key: SUPABASE_URL
          sync: false
        - key: SUPABASE_PUBLIC_KEY
          sync: false
        - key: SUPABASE_SERVICE_ROLE_KEY
          sync: false
        - key: SUPABASE_JWT_SECRET
          sync: false
        - key: DATABASE_URL
          sync: false
        - key: CORS_ORIGINS
          sync: false